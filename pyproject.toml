[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "podcast-builder"
version = "0.1.0"
description = "Automated weekly tech-regulation podcast builder using Claude AI"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.49.0",
    "openai>=1.60.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "feedparser>=6.0.11",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.0",
    "pydub>=0.25.1",
    "elevenlabs>=1.50.0",
    "feedgen>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
